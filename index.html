<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XIT - Secure Chat</title>
<link rel="manifest" href="/manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
<style>
:root {
  --bg-dark: #0a0f18;
  --panel-solid: #121824;
  --primary: #00e5ff;
  --sent-bubble: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
  --recv-bubble: #1a2233;
  --danger: #ff4757;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg-dark); color: white; overflow: hidden; }

#login-screen {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: radial-gradient(circle at center, #1a2233 0%, var(--bg-dark) 100%);
  z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
#login-screen h1 { font-size: 60px; letter-spacing: 10px; color: var(--primary); text-shadow: 0 0 20px rgba(0,229,255,0.4); margin-bottom: 50px; }
.login-box { width: 85%; max-width: 340px; display: flex; flex-direction: column; gap: 15px; }
.login-box input { padding: 18px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.5); color: white; font-size: 16px; outline: none; }
.login-box input:focus { border-color: var(--primary); }
.btn-primary { background: linear-gradient(90deg, #11998e, #38ef7d); color: #000; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; font-size: 16px; cursor: pointer; }

#approval-screen {
  position: fixed; top:0; left:0; width:100%; height:100%;
  background: var(--bg-dark); z-index: 9998; display: none;
  flex-direction: column; align-items: center; justify-content: center; padding: 20px;
}
#approval-code-input {
  padding: 15px; border-radius: 12px; border: 1px solid var(--primary);
  background: rgba(0,0,0,0.5); color: white; font-size: 24px;
  text-align: center; letter-spacing: 10px; width: 100%; max-width: 300px;
}

#install-btn {
  position: fixed; bottom: 80px; left: 20px; right: 20px;
  padding: 15px; background: var(--primary); color: #000;
  border: none; border-radius: 12px; font-weight: 800; font-size: 16px;
  z-index: 500; display: none; cursor: pointer;
}

#app { display: none; height: 100%; flex-direction: column; }
#chat-list { flex: 1; overflow-y: auto; }
.chat-row { display: flex; align-items: center; padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
.avatar { width: 50px; height: 50px; border-radius: 16px; background: linear-gradient(135deg, #2b3240, #141820); display: flex; align-items: center; justify-content: center; font-weight: 800; margin-right: 15px; flex-shrink: 0; }
#chat-window { position: fixed; top:0; left:100%; width:100%; height:100%; background: var(--bg-dark); z-index: 1500; display: flex; flex-direction: column; transition: 0.3s; }
#chat-window.open { left: 0; }
.chat-header { padding: 12px 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(15,20,30,0.9); }
.msg-flow { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.msg-wrapper { display: flex; width: 100%; }
.sent-wrap { justify-content: flex-end; }
.recv-wrap { justify-content: flex-start; }
.bubble { max-width: 75%; padding: 12px 16px; border-radius: 20px; font-size: 15px; word-wrap: break-word; }
.sent { background: var(--sent-bubble); color: white; border-bottom-right-radius: 4px; }
.recv { background: var(--recv-bubble); color: white; border-bottom-left-radius: 4px; }
.msg-time { font-size: 10px; margin-top: 6px; text-align: right; opacity: 0.6; }
#chat-input-row { padding: 12px 15px; display: flex; gap: 12px; align-items: center; background: rgba(15,20,30,0.9); border-top: 1px solid rgba(255,255,255,0.05); }
#msg-input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 25px; padding: 14px 20px; font-size: 15px; outline: none; }
.send-btn { background: var(--primary); color: #000; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; flex-shrink: 0; }

#loading { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); z-index: 10000; display: flex; align-items: center; justify-content: center; }
#loading .spinner { width: 50px; height: 50px; border: 3px solid rgba(0,229,255,0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div></div>

<div id="login-screen" style="display:none;">
  <h1>XIT</h1>
  <div class="login-box">
    <input type="text" id="user-input" placeholder="Username" autocomplete="off">
    <input type="password" id="pass-input" placeholder="Password">
    <button class="btn-primary" onclick="performLogin()">GET STARTED</button>
    <p style="font-size:12px; color:#888; text-align:center;">Bina phone/email ke account. Device se locked.</p>
  </div>
</div>

<div id="approval-screen">
  <h2 style="color: var(--primary);">🔐 Device Approval</h2>
  <p style="text-align: center; color: #aaa; margin: 20px 0;" id="approval-msg"></p>
  <input type="text" id="approval-code-input" placeholder="000000" maxlength="6">
  <button class="btn-primary" style="max-width: 300px; margin-top: 20px;" onclick="submitApprovalCode()">Verify Code</button>
</div>

<div id="app">
  <div style="padding: 20px; background: rgba(15,20,30,0.9); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center;">
    <b style="color: var(--primary); font-size: 22px;">XIT</b>
    <span id="my-username" style="color: #aaa;"></span>
  </div>
  <div id="chat-list">
    <p style="text-align:center; color:#666; padding:40px;" id="empty-chat">Koi chat nahi. + button se add karo.</p>
  </div>
  <div style="padding: 15px; display: flex; gap: 10px;">
    <input type="text" id="add-contact-input" placeholder="Username add karo..." style="flex:1; padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.1); background:rgba(0,0,0,0.5); color:white;">
    <button class="btn-primary" style="width:auto; padding:12px 20px;" onclick="addContact()">+</button>
  </div>
</div>

<button id="install-btn" onclick="installPWA()">📲 Install App</button>

<div id="chat-window">
  <div class="chat-header">
    <span onclick="closeChat()" style="font-size:28px; cursor:pointer;">←</span>
    <b id="active-name" style="flex:1; font-size:18px;"></b>
  </div>
  <div class="msg-flow" id="msg-flow"></div>
  <div id="chat-input-row">
    <input type="text" id="msg-input" placeholder="Message..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="send-btn" onclick="sendMsg()">➔</button>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const BACKEND_URL = 'https://your-backend.onrender.com'; // Render backend URL yahan daalo
const firebaseConfig = {
  apiKey: "AIzaSyCEFMQswwZ38RAD3F9qK9L9XtWdgmNSZ4E",
  authDomain: "notes-69142.firebaseapp.com",
  databaseURL: "https://notes-69142-default-rtdb.firebaseio.com",
  projectId: "notes-69142",
  storageBucket: "notes-69142.firebasestorage.app",
  messagingSenderId: "242815696119",
  appId: "1:242815696119:web:559f7bee4133a4d1e4a7f2"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// ============================================================
// DEXIE (IndexedDB) SETUP
// ============================================================
const dexieDb = new Dexie('XITDatabase');
dexieDb.version(1).stores({
  messages: '++id, room, ts',
  peers: 'username',
  cache: 'key'
});
// IndexedDB se data load (instant, offline)

// ============================================================
// GLOBAL STATE
// ============================================================
let myUid = null;
let myUsername = null;
let activeRoom = null;
let activePeer = null;
let currentDeviceId = null;
let pendingApproval = null;
let deferredPrompt = null;
let allMessagesCache = {}; // room -> array of messages

// ============================================================
// DEVICE ID
// ============================================================
function getDeviceId() {
  let id = localStorage.getItem('xit_device_id');
  if (!id) {
    id = 'dev_' + Math.random().toString(36).substring(2, 15);
    localStorage.setItem('xit_device_id', id);
  }
  return id;
}
function getDeviceName() {
  const ua = navigator.userAgent;
  if (/android/i.test(ua)) return 'Android';
  if (/iphone|ipad/i.test(ua)) return 'iOS';
  if (/windows/i.test(ua)) return 'Windows';
  if (/mac/i.test(ua)) return 'Mac';
  return 'Unknown';
}

// ============================================================
// LOGIN
// ============================================================
async function performLogin() {
  const username = document.getElementById('user-input').value.trim().toLowerCase();
  const password = document.getElementById('pass-input').value.trim();
  
  if (!username || !password) return alert("Username aur password dono daalo!");
  if (username.length < 3) return alert("Username kam se kam 3 character!");
  if (password.length < 6) return alert("Password kam se kam 6 character!");
  
  currentDeviceId = getDeviceId();
  const deviceName = getDeviceName();
  
  try {
    // Try register first, then login
    let res = await fetch(BACKEND_URL + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, deviceId: currentDeviceId, deviceName })
    });
    
    let data = await res.json();
    
    if (!data.success && data.error === 'Username already taken') {
      // Try login
      res = await fetch(BACKEND_URL + '/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, deviceId: currentDeviceId, deviceName })
      });
      data = await res.json();
    }
    
    if (data.success) {
      // Sign in with custom token
      await auth.signInWithCustomToken(data.token);
      myUid = data.uid;
      myUsername = username;
      localStorage.setItem('xit_uid', myUid);
      localStorage.setItem('xit_username', myUsername);
      
      if (data.recoveryCode) {
        alert(`Account ban gaya! 🎉\n\nRECOVERY CODE (safe rakho):\n${data.recoveryCode}`);
      }
      
      startApp();
    } else if (data.requiresApproval) {
      // New device approval flow
      pendingApproval = { username, password, code: data.securityCode };
      document.getElementById('approval-msg').innerText = 
        `Naya device detected. Aapke purane device pe security code bheja gaya hai. Woh code yahan daalo.`;
      document.getElementById('approval-screen').style.display = 'flex';
      document.getElementById('login-screen').style.display = 'none';
      
      // Poll for approval
      setInterval(async () => {
        const statusRes = await fetch(BACKEND_URL + '/approval-status/' + username);
        const statusData = await statusRes.json();
        if (statusData.status === 'approved') {
          // Try login again
          const loginRes = await fetch(BACKEND_URL + '/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, deviceId: currentDeviceId, deviceName })
          });
          const loginData = await loginRes.json();
          if (loginData.success) {
            await auth.signInWithCustomToken(loginData.token);
            myUid = loginData.uid;
            myUsername = username;
            localStorage.setItem('xit_uid', myUid);
            localStorage.setItem('xit_username', myUsername);
            document.getElementById('approval-screen').style.display = 'none';
            startApp();
          }
        }
      }, 3000);
    } else {
      alert(data.error || 'Login failed');
    }
  } catch (err) {
    console.error(err);
    alert('Backend connection failed. Render backend URL check karo.');
  }
}

async function submitApprovalCode() {
  const code = document.getElementById('approval-code-input').value.trim();
  if (!pendingApproval) return;
  
  const res = await fetch(BACKEND_URL + '/verify-approval', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: pendingApproval.username,
      deviceId: currentDeviceId,
      deviceName: getDeviceName(),
      code: code
    })
  });
  
  const data = await res.json();
  if (data.success) {
    await auth.signInWithCustomToken(data.token);
    myUid = data.uid;
    myUsername = pendingApproval.username;
    localStorage.setItem('xit_uid', myUid);
    localStorage.setItem('xit_username', myUsername);
    document.getElementById('approval-screen').style.display = 'none';
    startApp();
  } else {
    alert('Galat code! Dobara try karo.');
  }
}

// ============================================================
// START APP (with IndexedDB cache)
// ============================================================
async function startApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  document.getElementById('my-username').innerText = '@' + myUsername;
  
  // Load cached peers from IndexedDB (instant)
  const cachedPeers = await dexieDb.peers.toArray();
  renderChatList(cachedPeers);
  
  // Listen for peers from Firebase (real-time)
  db.ref('peers/' + myUid).on('value', async snap => {
    const peers = snap.val() || {};
    const peerList = Object.values(peers);
    
    // Save to IndexedDB
    await dexieDb.peers.clear();
    for (const p of peerList) {
      await dexieDb.peers.put({ username: p.peer, room: p.room });
    }
    
    renderChatList(peerList);
  });
  
  // Keep synced for offline (Firebase native)
  db.ref('peers/' + myUid).keepSynced(true);
}

// ============================================================
// RENDER CHAT LIST
// ============================================================
function renderChatList(peers) {
  const list = document.getElementById('chat-list');
  const empty = document.getElementById('empty-chat');
  
  if (peers.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  
  list.innerHTML = peers.map(p => `
    <div class="chat-row" onclick="openChat('${p.room}', '${p.peer}')">
      <div class="avatar">${p.peer[0].toUpperCase()}</div>
      <div style="flex:1;"><b>${p.peer}</b></div>
    </div>
  `).join('');
}

// ============================================================
// ADD CONTACT (for testing, simplified)
// ============================================================
async function addContact() {
  const input = document.getElementById('add-contact-input');
  const target = input.value.trim().toLowerCase();
  if (!target) return;
  
  // For demo: just add a dummy peer (real app mein request system chahiye)
  const room = [myUsername, target].sort().join('_');
  
  await db.ref('peers/' + myUid + '/' + target).set({ peer: target, room: room });
  await db.ref('peers/' + target + '/' + myUid).set({ peer: myUsername, room: room });
  
  input.value = '';
}

// ============================================================
// OPEN CHAT (IndexedDB first, then Firebase)
// ============================================================
async function openChat(room, peerName) {
  activeRoom = room;
  activePeer = peerName;
  document.getElementById('active-name').innerText = peerName;
  document.getElementById('chat-window').classList.add('open');
  
  const flow = document.getElementById('msg-flow');
  flow.innerHTML = '';
  
  // 1. LOAD FROM INDEXEDDB (instant!)
  const cached = await dexieDb.messages.where('room').equals(room).sortBy('ts');
  cached.forEach(m => renderMessage(m));
  
  // 2. LISTEN FIREBASE (sync new)
  db.ref('messages/' + room).on('value', async snap => {
    if (room !== activeRoom) return;
    flow.innerHTML = '';
    
    const firebaseMsgs = [];
    snap.forEach(ms => {
      const m = ms.val();
      m.key = ms.key;
      firebaseMsgs.push(m);
    });
    
    // Merge: render all (sorted by ts)
    firebaseMsgs.sort((a, b) => a.ts - b.ts);
    firebaseMsgs.forEach(m => renderMessage(m));
    
    // Save all to IndexedDB (write-through)
    for (const m of firebaseMsgs) {
      await dexieDb.messages.put({
        room: room,
        from: m.from,
        data: m.data,
        ts: m.ts,
        key: m.key
      });
    }
    
    setTimeout(() => flow.scrollTop = flow.scrollHeight, 100);
  });
  
  // Keep synced for offline
  db.ref('messages/' + room).keepSynced(true);
}

function renderMessage(m) {
  const flow = document.getElementById('msg-flow');
  const wrap = document.createElement('div');
  wrap.className = `msg-wrapper ${m.from === myUsername ? 'sent-wrap' : 'recv-wrap'}`;
  const time = new Date(m.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  wrap.innerHTML = `
    <div class="bubble ${m.from === myUsername ? 'sent' : 'recv'}">
      ${m.data}
      <div class="msg-time">${time}</div>
    </div>
  `;
  flow.appendChild(wrap);
}

function closeChat() {
  document.getElementById('chat-window').classList.remove('open');
  if (activeRoom) db.ref('messages/' + activeRoom).off();
  activeRoom = null;
  activePeer = null;
}

// ============================================================
// SEND MESSAGE (write to Firebase + IndexedDB)
// ============================================================
async function sendMsg() {
  const input = document.getElementById('msg-input');
  const val = input.value.trim();
  if (!val || !activeRoom) return;
  
  input.value = '';
  
  const msg = {
    from: myUsername,
    data: val,
    ts: Date.now()
  };
  
  // Save to IndexedDB immediately (instant UI)
  await dexieDb.messages.put({
    room: activeRoom,
    ...msg,
    key: 'local_' + Date.now()
  });
  
  // Send to Firebase
  db.ref('messages/' + activeRoom).push(msg);
}

// ============================================================
// PWA INSTALL
// ============================================================
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-btn').style.display = 'block';
});

function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choice) => {
      deferredPrompt = null;
      document.getElementById('install-btn').style.display = 'none';
    });
  }
}

// ============================================================
// SERVICE WORKER
// ============================================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}

// ============================================================
// INIT
// ============================================================
document.getElementById('loading').style.display = 'none';
document.getElementById('login-screen').style.display = 'flex';

// Check if already logged in
const savedUid = localStorage.getItem('xit_uid');
const savedUsername = localStorage.getItem('xit_username');
if (savedUid && savedUsername) {
  myUid = savedUid;
  myUsername = savedUsername;
  auth.onAuthStateChanged(user => {
    if (user) startApp();
  });
}
</script>
</body>
</html>
